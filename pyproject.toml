[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pv-mfaps-plugin"
version = "0.1.0"
description = "Feedback-aware finite-action allocation and fused execution hooks for long-tailed training"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "torch>=2.0"]

[tool.setuptools.packages.find]
where = ["src"]
